        setCartItems(prev => {

        const price = product.prices[weight];
        addToCart({
          id: `${product.id}-${weight}`,
          name: product.name,
          hindiName: product.hindiName,
          weight,
          price,
          quantity: 1,
          image: product.image
        });
        setFeedbackId(product.id);
        setTimeout(() => setFeedbackId(null), 1200);
      };

      // Custom Box calculations
      const filledSlots = boxSlots.filter(Boolean).length;
      const boxSweetsCost = boxSlots.reduce((tot, s) => tot + (s ? s.pricePerSlot * 2.5 : 0), 0);

        const updated = [...boxSlots];
        let target = activeSlot;
        if (updated[target]) {
          const nextEmpty = updated.findIndex(s => s === null);
          if (nextEmpty !== -1) target = nextEmpty;
        }
        updated[target] = sweet;
        setBoxSlots(updated);
        const next = updated.findIndex(s => s === null);

      const grandTotal = Math.max(0, subtotal + packFee + delFee - discount);
      const totalCartCount = cartItems.reduce((acc, i) => acc + (i.quantity || 1), 0);

          if (item.isCustomBox) {

                      <label className="block text-amber-200 font-semibold mb-1">Select Ribbon:</label>
                      <div className="grid grid-cols-3 gap-2">
                        {['Royal Velvet Red', 'Pure Gold Brocade', 'Festive Marigold'].map(r => (
                          <button
                            key={r}
                            onClick={() => setBoxRibbon(r)}
                            className={`py-1.5 px-2 rounded-xl text-[11px] border transition-all ${
                              boxRibbon === r
                                ? 'bg-amber-400 text-red-950 font-bold border-amber-300'
                                : 'bg-white/5 text-amber-100/70 border-white/10'
                            }`}
                          >
                            {r}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="block text-amber-200 font-semibold mb-1">Greeting Card Note (Free):</label>
                      <input
                        type="text"
                        value={boxMessage}
                        onChange={(e) => setBoxMessage(e.target.value)}
                        className="w-full bg-black/40 border border-amber-500/30 rounded-xl px-3 py-2 text-amber-100 text-xs focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="mt-6 pt-4 border-t border-amber-500/30 flex items-center justify-between">
                    <div>
                      <span className="text-xs text-amber-200/70 block">Total Box Price:</span>
                      <span className="text-2xl font-black text-amber-300">₹{totalBoxPrice}</span>
                    </div>
                    <button
                      onClick={handleAddBoxToCart}
                      disabled={filledSlots < 4}
                      className={`px-6 py-3 rounded-full font-bold text-xs sm:text-sm transition-all ${
                        filledSlots === 4
                          ? boxSuccess
                            ? 'bg-emerald-600 text-white'
                            : 'bg-gradient-to-r from-amber-400 to-yellow-500 text-red-950 hover:from-amber-300 hover:to-amber-400'
                          : 'bg-white/10 text-stone-400 cursor-not-allowed'
                      }`}
                    >
                      {boxSuccess ? '✓ Box Added!' : filledSlots === 4 ? 'Add Custom Box to Plate' : `Fill ${4 - filledSlots} More Slot(s)`}
                    </button>
                  </div>
                </div>

                {/* Sweet Selection Tray */}
                <div className="lg:col-span-6 space-y-4">
                  <h3 className="text-lg font-serif font-bold text-amber-100">
                    Pick Sweets for Slot #{activeSlot + 1}
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {BOX_BUILDER_OPTIONS.map(sweet => (
                      <div
                        key={sweet.id}
                        onClick={() => handleBoxSlotSweet(sweet)}
                        className="p-3.5 rounded-2xl bg-white/5 border border-amber-500/25 hover:border-amber-400 hover:bg-white/10 transition-all cursor-pointer flex items-center justify-between"
                      >
                        <div>
                          <span className="font-serif font-bold text-sm text-amber-100 block">{sweet.name}</span>
                          <span className="text-[11px] text-amber-200/60">{sweet.type}</span>
                        </div>
                        <span className="px-2 py-1 rounded-lg bg-amber-400/20 text-amber-300 text-xs font-bold">+</span>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* 6. PURITY PROMISE */}
          <section id="purity" className="py-16 sm:py-24 bg-white border-t border-amber-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
              <div className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold tracking-wider mb-3">
                <span>🛡️</span>
                <span>The Jai Ambe Purity Guarantee</span>
              </div>
              <h2 className="text-3xl sm:text-4xl font-serif font-bold text-red-950 mb-4">
                Four Decades of Trust, Pure Milk & 100% Desi Ghee
              </h2>
              <p className="text-stone-600 text-sm sm:text-base max-w-2xl mx-auto mb-12">
                We boil over 800 liters of pure cow & buffalo milk daily to prepare fresh, chemical-free mawa and chhena. No palm oil, zero vanaspati.
              </p>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 text-left">
                <div className="p-6 rounded-2xl bg-amber-50 border border-amber-200">
                  <span className="text-2xl mb-2 block">🪔</span>
                  <h3 className="font-serif font-bold text-red-950 text-lg mb-1">100% Shudh Desi Ghee</h3>
                  <p className="text-stone-600 text-xs leading-relaxed">Slow-churned pure Desi Ghee in every single ghee delicacy. Zero vanaspati or palm oil.</p>
                </div>
                <div className="p-6 rounded-2xl bg-amber-50 border border-amber-200">
                  <span className="text-2xl mb-2 block">🥛</span>
                  <h3 className="font-serif font-bold text-red-950 text-lg mb-1">Daily Fresh Chhena</h3>
                  <p className="text-stone-600 text-xs leading-relaxed">In-house slow-simmered cottage cheese and mawa prepared fresh every single sunrise.</p>
                </div>
                <div className="p-6 rounded-2xl bg-amber-50 border border-amber-200">
                  <span className="text-2xl mb-2 block">🌾</span>
                  <h3 className="font-serif font-bold text-red-950 text-lg mb-1">Kashmiri Kesar & Dry Fruits</h3>
                  <p className="text-stone-600 text-xs leading-relaxed">Original Pampore saffron and handpicked Goan cashews and California almonds.</p>
                </div>
                <div className="p-6 rounded-2xl bg-amber-50 border border-amber-200">
                  <span className="text-2xl mb-2 block">✨</span>
                  <h3 className="font-serif font-bold text-red-950 text-lg mb-1">Pure Silver Vark</h3>
                  <p className="text-stone-600 text-xs leading-relaxed">100% Vegetarian machine-made silver foil tested for maximum purity.</p>
                </div>
              </div>
            </div>
          </section>

          {/* 7. WEDDING & CATERING */}
          <section id="catering" className="py-16 sm:py-24 bg-[#FAF7F0] border-t border-amber-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-12">
                <span className="text-xs font-bold text-amber-800 uppercase tracking-wider block mb-2">Bulk Orders & Events</span>
                <h2 className="text-3xl sm:text-4xl font-serif font-bold text-red-950 mb-3">
                  Wedding & Corporate Bulk Mithai Estimator
                </h2>
                <p className="text-stone-600 text-sm">
                  Estimate total sweet requirement and unlock wholesale discounts for your upcoming function.
                </p>
              </div>

              <div className="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-amber-200 shadow-md space-y-5">
                <div>
                  <div className="flex justify-between text-xs font-bold text-stone-700 mb-1">
                    <span>Number of Guests / Boxes:</span>
                    <span className="text-red-950 font-black">{guestCount} Boxes</span>
                  </div>
                  <input
                    type="range"
                    min="50"
                    max="1000"
                    step="25"
                    value={guestCount}
                    onChange={(e) => setGuestCount(Number(e.target.value))}
                    className="w-full accent-red-900"
                  />
                </div>

                <div className="grid grid-cols-3 gap-3 text-center bg-amber-50 p-4 rounded-2xl border border-amber-200">
                  <div>
                    <span className="text-xs text-stone-500 block">Total Mithai</span>
                    <span className="text-lg font-bold text-red-950">{Math.round(guestCount * 0.5)} kg</span>
                  </div>
                  <div>
                    <span className="text-xs text-stone-500 block">Bulk Discount</span>
                    <span className="text-lg font-bold text-emerald-700">{guestCount >= 300 ? '15%' : '10%'} OFF</span>
                  </div>
                  <div>
                    <span className="text-xs text-stone-500 block">Gold Foil Box</span>
                    <span className="text-lg font-bold text-amber-800">FREE</span>
                  </div>
                </div>

                <a
                  href={`https://wa.me/${SHOP_INFO.whatsapp}?text=${encodeURIComponent(`Namaste Jai Ambe Sweets! Inquiring about a bulk order for ${guestCount} boxes (approx ${Math.round(guestCount * 0.5)} kg). Please share quotation.`)}`}
                  target="_blank"
                  className="w-full py-3.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2 shadow-md transition-all"
                >
                  💬 Request Bulk Quote on WhatsApp
                </a>
              </div>
            </div>
          </section>

          {/* 8. REVIEWS */}
          <section id="reviews" className="py-16 sm:py-24 bg-white border-t border-amber-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
              <span className="text-xs font-bold text-amber-800 uppercase tracking-wider block mb-2">Testimonials</span>
              <h2 className="text-3xl sm:text-4xl font-serif font-bold text-red-950 mb-10">
                Loved Across Generations
              </h2>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-left">
                {REVIEWS.map((r, i) => (
                  <div key={i} className="p-6 rounded-2xl bg-amber-50/50 border border-amber-200 flex flex-col justify-between">
                    <div>
                      <div className="text-amber-400 mb-2">★★★★★</div>
                      <p className="text-stone-700 text-xs sm:text-sm italic mb-4 leading-relaxed">"{r.text}"</p>
                    </div>
                    <div className="pt-3 border-t border-amber-200">
                      <h4 className="font-serif font-bold text-red-950 text-sm">{r.name}</h4>
                      <p className="text-xs text-stone-500">{r.location}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* 9. LOCATION & FAQ */}
          <section id="location" className="py-16 sm:py-24 bg-[#FAF7F0] border-t border-amber-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <div className="lg:col-span-5 bg-white p-6 sm:p-8 rounded-3xl border border-amber-200 shadow-sm space-y-4">
                  <h3 className="font-serif font-bold text-2xl text-red-950">{SHOP_INFO.name}</h3>
                  <p className="text-xs text-amber-800 font-semibold">{SHOP_INFO.hindiName}</p>
                  <p className="text-xs sm:text-sm text-stone-600">📍 {SHOP_INFO.address}, {SHOP_INFO.city}</p>
                  <p className="text-xs sm:text-sm text-stone-600">🕒 {SHOP_INFO.timings}</p>
                  <p className="text-xs sm:text-sm text-stone-600">📞 {SHOP_INFO.phone}</p>
                  
                  <div className="pt-2 flex gap-3">
                    <a
                      href={SHOP_INFO.googleMapsUrl}
                      target="_blank"
                      className="flex-1 py-2.5 rounded-xl bg-red-900 text-amber-100 text-xs font-bold text-center"
                    >
                      🗺️ Google Maps Directions
                    </a>
                  </div>
                </div>

                <div className="lg:col-span-7 space-y-3">
                  <h3 className="font-serif font-bold text-xl text-red-950 mb-3">Frequently Asked Questions</h3>
                  {FAQS.map((faq, i) => (
                    <div key={i} className="bg-white rounded-2xl border border-amber-200 p-4">
                      <button
                        onClick={() => setOpenFaq(openFaq === i ? null : i)}
                        className="w-full text-left font-serif font-bold text-sm text-stone-900 flex justify-between items-center"
                      >
                        <span>{faq.q}</span>
                        <span>{openFaq === i ? '▲' : '▼'}</span>
                      </button>
                      {openFaq === i && (
                        <p className="text-xs sm:text-sm text-stone-600 mt-2 pt-2 border-t border-amber-100 leading-relaxed">
                          {faq.a}
                        </p>
                      )}
                    </div>
                  ))}
                </div>

              </div>
            </div>
          </section>

          {/* 10. FOOTER */}
          <footer className="bg-gradient-to-b from-[#2B0909] to-[#1A0505] text-amber-100/80 py-12 border-t border-amber-600/30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
              <div>
                <span className="font-serif font-bold text-white text-base block">{SHOP_INFO.name} ({SHOP_INFO.hindiName})</span>
                <span className="text-amber-400">Serving Purity & 100% Desi Ghee Since 1984 | FSSAI Lic: {SHOP_INFO.fssai}</span>
              </div>
              <div>
                © {new Date().getFullYear()} Jai Ambe Sweets. All Rights Reserved.
              </div>
            </div>
          </footer>

          {/* PRODUCT DETAIL MODAL */}
          {selectedProductForModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 relative border border-amber-300">
                <button
                  onClick={() => setSelectedProductForModal(null)}
                  className="absolute top-4 right-4 text-stone-500 font-bold"
                >
                  ✕
                </button>
                <img
                  src={selectedProductForModal.image}
                  alt={selectedProductForModal.name}
                  className="w-full h-48 object-cover rounded-2xl mb-4"
                />
                <span className="text-xs font-bold text-amber-800">{selectedProductForModal.hindiName}</span>
                <h3 className="font-serif font-bold text-xl text-red-950 mb-2">{selectedProductForModal.name}</h3>
                <p className="text-xs text-stone-600 mb-4">{selectedProductForModal.description}</p>
                <div className="text-xs bg-amber-50 p-2.5 rounded-xl border border-amber-200 mb-4 space-y-1">
                  <p><strong>Ingredients:</strong> {selectedProductForModal.ingredients}</p>
                  <p><strong>Shelf Life:</strong> {selectedProductForModal.shelfLife}</p>
                </div>

                <div className="grid grid-cols-3 gap-2 mb-4">
                  {['250g', '500g', '1kg'].map(w => (
                    <button
                      key={w}
                      onClick={() => setModalWeight(w)}
                      className={`py-2 rounded-xl text-xs font-bold border ${
                        modalWeight === w ? 'bg-red-900 text-amber-100 border-red-950' : 'bg-white text-stone-700 border-amber-200'
                      }`}
                    >
                      {w} (₹{selectedProductForModal.prices[w]})
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => {
                    addToCart({
                      id: `${selectedProductForModal.id}-${modalWeight}`,
                      name: selectedProductForModal.name,
                      hindiName: selectedProductForModal.hindiName,
                      weight: modalWeight,
                      price: selectedProductForModal.prices[modalWeight],
                      quantity: 1,
                      image: selectedProductForModal.image
                    });
                    setSelectedProductForModal(null);
                  }}
                  className="w-full py-3 rounded-full bg-red-900 hover:bg-red-950 text-amber-100 font-bold text-xs"
                >
                  Add to Plate (₹{selectedProductForModal.prices[modalWeight]})
                </button>
              </div>
            </div>
          )}

          {/* SLIDE-OVER CART DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden bg-black/60 backdrop-blur-sm animate-fadeIn">
              <div className="absolute inset-0" onClick={() => setIsCartOpen(false)}></div>
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                  
                  <div className="p-4 bg-red-950 text-white flex justify-between items-center">
                    <span className="font-serif font-bold text-base text-amber-200">Your Mithai Plate ({cartItems.length})</span>
                    <button onClick={() => setIsCartOpen(false)} className="text-amber-200">✕</button>
                  </div>

                  <div className="flex-1 overflow-y-auto p-4 space-y-3">
                    {cartItems.length === 0 ? (
                      <div className="text-center py-16 text-stone-500 text-xs">Your plate is empty!</div>
                    ) : (
                      cartItems.map((item, idx) => (
                        <div key={item.id} className="p-3 rounded-xl bg-amber-50/50 border border-amber-200 flex gap-3 items-center">
                          <img src={item.image} className="w-12 h-12 rounded-lg object-cover" />
                          <div className="flex-1 min-w-0">
                            <h5 className="font-serif font-bold text-xs truncate text-red-950">{item.name}</h5>
                            <span className="text-[10px] text-stone-500">{item.weight} • ₹{item.price}</span>
                          </div>
                          <div className="flex items-center gap-1">
                            <button
                              onClick={() => {
                                const updated = [...cartItems];
                                if ((updated[idx].quantity || 1) > 1) {
                                  updated[idx].quantity -= 1;
                                  setCartItems(updated);
                                } else {
                                  setCartItems(cartItems.filter(p => p.id !== item.id));
                                }
                              }}
                              className="px-2 py-0.5 bg-stone-200 rounded text-xs font-bold"
                            >
                              -
                            </button>
                            <span className="text-xs font-bold px-1">{item.quantity || 1}</span>
                            <button
                              onClick={() => {
                                const updated = [...cartItems];
                                updated[idx].quantity = (updated[idx].quantity || 1) + 1;
                                setCartItems(updated);
                              }}
                              className="px-2 py-0.5 bg-stone-200 rounded text-xs font-bold"
                            >
                              +
                            </button>
                          </div>
                        </div>
                      ))
                    )}

                    {cartItems.length > 0 && (
                      <div className="space-y-2 text-xs pt-2">
                        <input
                          type="text"
                          placeholder="Your Name"
                          value={custName}
                          onChange={(e) => setCustName(e.target.value)}
                          className="w-full p-2 border border-stone-200 rounded-lg text-xs"
                        />
                        <input
                          type="tel"
                          placeholder="Phone Number"
                          value={custPhone}
                          onChange={(e) => setCustPhone(e.target.value)}
                          className="w-full p-2 border border-stone-200 rounded-lg text-xs"
                        />
                        <input
                          type="text"
                          placeholder="Delivery Address"
                          value={custAddress}
                          onChange={(e) => setCustAddress(e.target.value)}
                          className="w-full p-2 border border-stone-200 rounded-lg text-xs"
                        />
                      </div>
                    )}
                  </div>

                  {cartItems.length > 0 && (
                    <div className="p-4 border-t border-amber-200 space-y-2">
                      <div className="flex justify-between text-xs">
                        <span>Subtotal:</span>
                        <span className="font-bold">₹{subtotal}</span>
                      </div>
                      <div className="flex justify-between text-xs">
                        <span>Delivery:</span>
                        <span className="font-bold text-emerald-700">{delFee === 0 ? 'FREE' : `₹${delFee}`}</span>
                      </div>
                      <div className="flex justify-between text-sm font-bold text-red-950 font-serif pt-1 border-t">
                        <span>Grand Total:</span>
                        <span>₹{grandTotal}</span>
                      </div>

                      <button
                        onClick={handleWhatsAppOrder}
                        className="w-full py-3 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md transition-all flex items-center justify-center gap-2"
                      >
                        💬 Confirm & Order on WhatsApp
                      </button>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
